plugins { id 'com.android.application' }

android {
    namespace 'com.hutao.terminal'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hutao.terminal'
        minSdk 24
        // targetSdk 28: Android 10+ blocks exec() of files in app data (W^X); 28 keeps user binaries in $HOME runnable, same trick as Termux.
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.0'
}
